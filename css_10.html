<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #333;
      text-align: center;
      padding: 50px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: auto;
    }

    h1 {
      margin: 0 0 10px;
    }

    p {
      margin: 0 0 20px;
    }

    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #1e40af; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Welcome!</h1>
    <p>This is a small simple HTML + CSS page.</p>
    <button class="btn" onclick="alert('Hello Gautam!')">Click Me</button>
  </div>
</body>
</html>
