<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My First CSS Example</title>

  <!-- Internal CSS -->
  <style>
    body {
      background-color: lightyellow; /* बैकग्राउंड रंग */
      font-family: Arial, sans-serif; /* टेक्स्ट का फॉन्ट */
    }

    h1 {
      color: darkblue;        /* हेडिंग का रंग */
      text-align: center;     /* हेडिंग को बीच में लाना */
    }

    p {
      color: green;           /* पैराग्राफ का रंग */
      font-size: 18px;        /* टेक्स्ट का साइज */
      border: 2px solid red;  /* बॉर्डर लगाना */
      padding: 10px;          /* अंदर की दूरी */
      background-color: #f0f8ff; /* हल्का बैकग्राउंड */
    }
  </style>
</head>
<body>

  <h1>नमस्ते! मैं CSS सीख रहा हूँ</h1>
  <p>
    यह मेरा पहला CSS वाला पैराग्राफ है।  
    CSS से वेबसाइट और भी सुंदर और आकर्षक बनती है।
  </p>

</body>
</html>
