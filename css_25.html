<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loader  Example</title>
  <style>
    html, body{
      height : 200;
      width : 200;
    }
    body{
      padding :50px;
      display :flex;
      justify-content : center;
      align-items : center;
    }
    #loader {
      height: 100px;
      width: 100px;
      border-radius: 50%;
      border: 5px solid  rgb(255,00,00);   /* हल्का सा रंग */
      border-top-color: rgb(120,30,255);     /* ऊपर का हिस्सा अलग रंग का */
      animation: spin 1s linear infinite; /* animation apply */
    }

    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
   <div id ="loader"></div>
</body>
</html>
